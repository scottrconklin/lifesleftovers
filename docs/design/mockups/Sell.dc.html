a{color:#1B385B}a:hover{color:#12273F}

</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4EBDD; color: #1B385B; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; gap: 6px; padding: 12px 20px 4px">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #1B385B; text-decoration: none">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-family: Manrope, sans-serif; font-weight: 800; font-size: 20px">Review your listing</h1>
    <span style="font-size: 13px; color: #4F5F70">Step 2 of 2</span>
  </header>

  <form style="flex: 1; padding: 6px 20px 0; display: flex; flex-direction: column; gap: 11px">
    <div style="display: flex; gap: 8px">
      <div style="width: 72px; height: 72px; border-radius: 10px; background: #E9DFCE; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #4F5F70; text-align: center; border: 2px solid #1B385B; box-sizing: border-box">Cover photo</div>
      <div style="width: 72px; height: 72px; border-radius: 10px; background: #E9DFCE; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #4F5F70">Photo 2</div>
      <div style="width: 72px; height: 72px; border-radius: 10px; background: #E9DFCE; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #4F5F70">Photo 3</div>
      <button type="button" aria-label="Add photo" style="width: 72px; height: 72px; border-radius: 10px; border: 1.5px dashed #1B385B; background: transparent; color: #1B385B; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #FBF1D9; font-size: 13px">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1B385B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"></path></svg>
      <span>Filled in from your photos. Change anything.</span>
    </div>

    <div>
      <label for="title" style="display: block; font-size: 13px; font-weight: 700">Title</label>
      <input id="title" type="text" value="Vintage red metal toolbox" style="margin-top: 4px; width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1.5px solid #B9AE9C; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #1B385B">
    </div>

    <div>
      <label for="cat" style="display: block; font-size: 13px; font-weight: 700">Category</label>
      <select id="cat" style="margin-top: 4px; width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1.5px solid #B9AE9C; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #1B385B">
        <option>Tools &amp; Building Leftovers</option>
        <option>Clothing, Shoes &amp; Handbags</option>
        <option>Home &amp; Kitchen</option>
      </select>
    </div>

    <div>
      <label for="why" style="display: block; font-size: 13px; font-weight: 700">Why it’s here</label>
      <textarea id="why" rows="2" style="margin-top: 4px; width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #B9AE9C; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #1B385B; resize: none">Grandpa’s toolbox. He’d want it used, not sitting in my garage.</textarea>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0">
      <legend style="font-size: 13px; font-weight: 700; padding: 0">Starting price</legend>
      <div style="margin-top: 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; flex-direction: column; justify-content: center; min-height: 52px; padding: 6px 12px; border-radius: 10px; border: 2px solid #1B385B; background: #FFFFFF; box-sizing: border-box">
          <span style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px"><input type="radio" name="start" checked style="margin: 0; accent-color: #1B385B">$1 start</span>
          <span style="font-size: 12px; color: #4F5F70">Most bids</span>
        </label>
        <label style="display: flex; flex-direction: column; justify-content: center; min-height: 52px; padding: 6px 12px; border-radius: 10px; border: 1.5px solid #B9AE9C; background: #FFFFFF; box-sizing: border-box">
          <span style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px"><input type="radio" name="start" style="margin: 0; accent-color: #1B385B">Set my own</span>
          <span style="font-size: 12px; color: #4F5F70">Suggested: $15</span>
        </label>
      </div>
    </fieldset>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div>
        <label for="night" style="display: block; font-size: 13px; font-weight: 700">Closing Night</label>
        <select id="night" style="margin-top: 4px; width: 100%; height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 10px; border: 1.5px solid #B9AE9C; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #1B385B">
          <option>Sun, Nov 22</option>
          <option>Sun, Nov 29</option>
        </select>
      </div>
      <div>
        <label for="pickup" style="display: block; font-size: 13px; font-weight: 700">Pickup area</label>
        <input id="pickup" type="text" value="Katy 77494" style="margin-top: 4px; width: 100%; height: 44px; box-sizing: border-box; padding: 0 10px; border-radius: 10px; border: 1.5px solid #B9AE9C; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #1B385B">
      </div>
    </div>
    <p style="margin: 0; font-size: 12px; color: #4F5F70">Buyers see only your area and distance. Your address goes to the winner after they pay. Selling is free.</p>
  </form>

  <div style="padding: 12px 20px 26px; background: #FFFFFF; border-top: 1px solid #E3D8C6">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 12px; background: #C43E2A; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 18px">Post it</a>
  </div>
</div>
</x-dc>
