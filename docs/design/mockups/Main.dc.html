<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The wall</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B385B}a:hover{color:#12273F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4EBDD; color: #1B385B; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px">
    <span role="img" aria-label="Life's Leftovers" style="display: inline-flex; font-family: Manrope, 'DM Sans', sans-serif; font-weight: 800; letter-spacing: -0.02em; font-size: 21px; line-height: 1.02; color: #1B385B">
      <span aria-hidden="true"><span style="display: inline-block">Life’s<svg viewBox="0 0 40 40" width="18" height="18" fill="none" style="display: inline-block; vertical-align: top; margin-top: -6px; margin-left: 2px; color: #F5B82E"><line x1="8" y1="22" x2="15" y2="8" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"></line><line x1="16" y1="28" x2="30" y2="17" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"></line><line x1="20" y1="35" x2="35" y2="32" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"></line></svg></span><span style="display: block">Leftovers</span></span>
    </span>
    <button type="button" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border: 1px solid #1B385B; border-radius: 22px; background: #FFFFFF; color: #1B385B; font-family: inherit; font-size: 14px; font-weight: 700">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      Katy · 15 mi
    </button>
  </header>

  <section aria-label="Closing Night countdown" style="margin: 6px 20px 0; padding: 14px 16px; border-radius: 14px; background: #F5B82E; color: #1B385B; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline></svg>
      <div>
        <div style="font-family: Manrope, sans-serif; font-weight: 800; font-size: 17px">Closing Night</div>
        <div style="font-size: 13px; font-weight: 500">Sunday · 7–9 PM · 142 auctions</div>
      </div>
    </div>
    <div style="display: flex; gap: 8px; text-align: center">
      <div><div style="font-family: Manrope, sans-serif; font-weight: 800; font-size: 22px; line-height: 1">02</div><div style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em">DAYS</div></div>
      <div><div style="font-family: Manrope, sans-serif; font-weight: 800; font-size: 22px; line-height: 1">14</div><div style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em">HRS</div></div>
      <div><div style="font-family: Manrope, sans-serif; font-weight: 800; font-size: 22px; line-height: 1">37</div><div style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em">MIN</div></div>
    </div>
  </section>

  <nav aria-label="Filters" style="display: flex; gap: 8px; padding: 14px 20px 12px; overflow: hidden">
    <button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #1B385B; background: #1B385B; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; white-space: nowrap">All</button>
    <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #1B385B; background: #FFFFFF; color: #1B385B; font-family: inherit; font-size: 14px; font-weight: 700; white-space: nowrap">Nice Finds</button>
    <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #1B385B; background: #FFFFFF; color: #1B385B; font-family: inherit; font-size: 14px; font-weight: 700; white-space: nowrap">Free</button>
    <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #1B385B; background: #FFFFFF; color: #1B385B; font-family: inherit; font-size: 14px; font-weight: 700; white-space: nowrap">Lots</button>
    <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #1B385B; background: #FFFFFF; color: #1B385B; font-family: inherit; font-size: 14px; font-weight: 700; white-space: nowrap">Second Chance</button>
  </nav>

  <main style="flex: 1; overflow: hidden; padding: 0 20px">
    <h2 style="margin: 0 0 10px; font-family: Manrope, sans-serif; font-weight: 800; font-size: 18px">Ending Sunday near you</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
        <a href="Item.dc.html" style="display: block; text-decoration: none; color: #1B385B; background: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(27,56,91,0.08)">
          <div style="position: relative; aspect-ratio: 1 / 1; background: #E9DFCE; display: flex; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box">
            <span style="font-size: 12px; color: #4F5F70; text-align: center">Photo: {{item.photo}}</span>
            <sc-if value="{{item.isNice}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 6px; background: #1B385B; color: #FFFFFF; font-size: 11px; font-weight: 700; letter-spacing: 0.04em">NICE FIND</span></sc-if>
            <sc-if value="{{item.isLot}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 8px; left: 8px; padding: 2px 8px; border-radius: 6px; background: #FFFFFF; border: 1.5px solid #1B385B; color: #1B385B; font-size: 11px; font-weight: 700; letter-spacing: 0.04em">{{item.lotLabel}}</span></sc-if>
            <sc-if value="{{item.isFree}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 6px; background: #477A59; color: #FFFFFF; font-size: 11px; font-weight: 700; letter-spacing: 0.04em">FREE</span></sc-if>
          </div>
          <div style="padding: 10px 12px 12px">
            <div style="font-family: Manrope, sans-serif; font-weight: 700; font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.title}}</div>
            <div style="margin-top: 4px; font-size: 15px"><strong>{{item.price}}</strong> · {{item.bids}}</div>
            <div style="margin-top: 2px; font-size: 13px; color: #4F5F70">{{item.where}}</div>
            <div style="margin-top: 8px; display: inline-block; padding: 3px 8px; border-radius: 6px; background: #FBF1D9; font-size: 12px; font-weight: 700">{{item.ends}}</div>
          </div>
        </a>
      </sc-for>
    </div>
  </main>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E3D8C6; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 8px; box-sizing: border-box">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; text-decoration: none; color: #1B385B; font-size: 11px; font-weight: 700">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home
    </a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; text-decoration: none; color: #4F5F70; font-size: 11px; font-weight: 500">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.6" y2="16.6"></line></svg>Browse
    </a>
    <a href="Sell.dc.html" aria-label="Sell an item" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #1B385B; font-size: 11px; font-weight: 700; margin-top: -26px">
      <span style="width: 58px; height: 58px; border-radius: 29px; background: #C43E2A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(196,62,42,0.35); border: 4px solid #FFFFFF">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </span>Sell
    </a>
    <a href="Won.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; text-decoration: none; color: #4F5F70; font-size: 11px; font-weight: 500">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>Alerts
    </a>
    <a href="Won.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; text-decoration: none; color: #4F5F70; font-size: 11px; font-weight: 500">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Account
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { title: 'Vintage red toolbox', price: '$7', bids: '5 bids', where: '2.4 mi · Katy', ends: 'Ends Sun 7:32 PM', photo: 'red metal toolbox' },
        { title: 'Leather shoulder bag', price: '$38', bids: '4 bids', where: '3.1 mi · Katy', ends: 'Ends Sun 7:41 PM', photo: 'brown leather purse', isNice: true },
        { title: 'Cheer & lacrosse uniforms', price: '$12', bids: '6 bids', where: '0.8 mi · Katy', ends: 'Ends Sun 7:43 PM', photo: 'three bags of uniforms', isLot: true, lotLabel: 'LOT · 3 BAGS' },
        { title: 'Roll of metal flashing', price: 'Free', bids: '9 want it', where: '4.2 mi · Katy', ends: 'Ends Sun 7:50 PM', photo: 'roll of roof flashing', isFree: true },
        { title: 'Extra tile, 1 box', price: '$1', bids: '3 bids', where: '6.2 mi · Cypress', ends: 'Ends Sun 8:02 PM', photo: 'box of floor tile' },
        { title: "Kids' bike, 16 in", price: '$3', bids: '6 bids', where: '4.7 mi · Katy', ends: 'Ends Sun 8:11 PM', photo: 'small blue bike' }
      ]
    };
  }
}
</script>
</body>
</html>
