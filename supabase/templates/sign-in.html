<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Life's Leftovers sign-in link</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f4ebdd;
      font-family: &quot;DM Sans&quot;, Arial, sans-serif;
      color: #1b385b;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f4ebdd; padding: 24px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              background: #ffffff;
              border: 1px solid #d6ccbb;
              border-radius: 16px;
            "
          >
            <tr>
              <td
                style="
                  padding: 28px 28px 8px 28px;
                  font-family: Manrope, Arial, sans-serif;
                  font-size: 22px;
                  font-weight: 800;
                  color: #1b385b;
                "
              >
                Life's Leftovers
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 28px 0 28px; font-size: 16px; line-height: 24px">
                Here's your sign-in link. It works once and expires in an hour.
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 28px">
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
                  style="
                    display: inline-block;
                    background: #c43e2a;
                    color: #ffffff;
                    text-decoration: none;
                    font-weight: 700;
                    font-size: 16px;
                    padding: 14px 22px;
                    border-radius: 10px;
                  "
                >
                  Sign in to Life's Leftovers
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 28px; font-size: 16px; line-height: 24px">
                Or type this code on the sign-in screen:
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 8px 28px 24px 28px;
                  font-family: Manrope, Arial, sans-serif;
                  font-size: 30px;
                  font-weight: 800;
                  letter-spacing: 6px;
                  color: #1b385b;
                "
              >
                {{ .Token }}
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 28px 28px 28px;
                  font-size: 14px;
                  line-height: 20px;
                  color: #4f5f70;
                "
              >
                Didn't ask for this? You can ignore this email. Nobody can sign in without the link
                or code.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
