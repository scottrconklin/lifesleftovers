name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env.local
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db:
    name: Migrations and DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create local env files from the examples
        run: pnpm exec tsx scripts/local-env.ts prepare
      # DB tests need Postgres only.
      - name: Start Supabase (Postgres only)
        run: >-
          pnpm exec supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Start local image storage (RustFS)
        run: docker compose up -d --wait
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:db
      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create local env files from the examples
        run: pnpm exec tsx scripts/local-env.ts prepare
      # Auth (gotrue) and Mailpit for sign-in, Realtime for live bids, kong in front of both.
      - name: Start Supabase (Postgres, Auth, Realtime, Mailpit)
        run: >-
          pnpm exec supabase start
          -x storage-api,imgproxy,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Fill the local Supabase keys into .env.local
        run: pnpm exec tsx scripts/local-env.ts sync
      - name: Start local image storage (RustFS)
        run: docker compose up -d --wait
      - run: pnpm db:migrate
      # Geography, Houston open, fake users, 200 listings with photos, waitlist signups.
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
